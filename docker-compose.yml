# RMS YASKAWA — Docker Compose; additive Reverb, preserve existing services.
# Root .env is for Docker/PostgreSQL only; Laravel .env is src/.env.
services:
  php_yaskawa:
    build:
      context: ./php
    image: latest:php_yaskawa
    container_name: php_yaskawa
    hostname: php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ./php/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
    depends_on:
      postgres_yaskawa:
        condition: service_healthy

  postgres_yaskawa:
    image: postgres:16-alpine
    container_name: postgres_yaskawa
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in root .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in root .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5433}:5432"
    volumes:
      - ./database/postgres_yaskawa_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  # ADDITION ONLY: Laravel Reverb on its own internal Docker port 8080.
  # 8080 inside reverb container does not conflict with public Nginx :8080.
  # No host port: browser connects through Nginx /app/ proxy.
  reverb_yaskawa:
    image: latest:php_yaskawa
    container_name: reverb_yaskawa
    hostname: reverb
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    entrypoint: ["php", "artisan", "reverb:start"]
    command: ["--host=0.0.0.0", "--port=8080"]
    stop_grace_period: 20s
    depends_on:
      php_yaskawa:
        condition: service_started
    # DO NOT add ports: Reverb must not be exposed on host directly.

  nginx_yaskawa:
    build:
      context: ./nginx
    image: rms-yaskawa-nginx:local
    container_name: nginx_yaskawa
    hostname: nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php_yaskawa:
        condition: service_started
    # Reverb is intentionally NOT a hard dependency of Nginx.
    # If Reverb stops, old RMS and JSON polling fallback remain available.

volumes:
  postgres_yaskawa_data:
